<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#2c3e50" rx="20"/>
  
  <!-- Camera body -->
  <rect x="20" y="35" width="60" height="45" fill="#e74c3c" rx="8"/>
  
  <!-- Camera lens (outer circle) -->
  <circle cx="50" cy="57.5" r="18" fill="#34495e"/>
  
  <!-- Camera lens (middle circle) -->
  <circle cx="50" cy="57.5" r="14" fill="#2c3e50"/>
  
  <!-- Camera lens (inner circle - glass shine) -->
  <circle cx="50" cy="57.5" r="10" fill="#1a1a1a"/>
  
  <!-- Lens shine effect -->
  <circle cx="47" cy="54" r="4" fill="#ffffff" opacity="0.6"/>
  
  <!-- Camera flash -->
  <rect x="28" y="42" width="8" height="8" fill="#ecf0f1" rx="1"/>
  
  <!-- Camera top detail -->
  <rect x="45" y="30" width="10" height="6" fill="#34495e" rx="2"/>
</svg>